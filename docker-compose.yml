version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nexusos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nexusos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexusos_secret_password}
      POSTGRES_DB: ${DB_NAME:-nexusos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexusos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexusos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: nexusos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nexusos_redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - nexusos-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: nexusos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nexusos_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nexusos_minio_secret_key_change_me}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - nexusos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # OpenSearch (Elasticsearch alternative)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: nexusos-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-nexusos_opensearch_admin}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      plugins.security.disabled: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - nexusos-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NexusOS API (NestJS)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexusos-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-nexusos}:${DB_PASSWORD:-nexusos_secret_password}@postgres:5432/${DB_NAME:-nexusos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexusos_redis_secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nexusos_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nexusos_minio_secret_key_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-nexusos-assets}
      OPENSEARCH_NODE: http://opensearch:9200
      JWT_SECRET: ${JWT_SECRET:-nexusos_jwt_super_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-nexusos_encryption_32_chars_key!!}
      ENABLE_SWAGGER: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      opensearch:
        condition: service_healthy
    networks:
      - nexusos-network
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NexusOS Web (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: nexusos-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    networks:
      - nexusos-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NexusOS Workers (BullMQ)
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: nexusos-workers
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-nexusos}:${DB_PASSWORD:-nexusos_secret_password}@postgres:5432/${DB_NAME:-nexusos}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexusos_redis_secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nexusos_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nexusos_minio_secret_key_change_me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusos-network
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # Traefik Reverse Proxy (optional, Coolify provides this)
  # Uncomment if deploying standalone without Coolify
  # traefik:
  #   image: traefik:v2.10
  #   container_name: nexusos-traefik
  #   restart: unless-stopped
  #   command:
  #     - "--api.dashboard=true"
  #     - "--providers.docker=true"
  #     - "--entrypoints.web.address=:80"
  #     - "--entrypoints.websecure.address=:443"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - nexusos-network

networks:
  nexusos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  opensearch_data:
    driver: local
